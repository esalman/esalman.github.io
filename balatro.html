<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balatro Scoreboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', 'Arial Bold', Gadget, sans-serif;
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #3d2b5e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background texture */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(138, 43, 226, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(75, 0, 130, 0.1) 0%, transparent 50%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        #scoreboard {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        #scoreboard-frame {
            background: linear-gradient(145deg, #2a1a4a, #1f1235);
            border: 6px solid #4a3a6a;
            border-radius: 30px;
            padding: 60px 100px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 -5px 20px rgba(0, 0, 0, 0.4),
                inset 0 5px 20px rgba(138, 43, 226, 0.2);
            position: relative;
            overflow: visible;
        }

        #scoreboard-frame::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(45deg, #8a2be2, #daa520, #8a2be2);
            border-radius: 32px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #scoreboard-frame.flash::before {
            opacity: 1;
        }

        .label {
            font-size: 24px;
            color: #9370db;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(147, 112, 219, 0.5);
        }

        #score {
            font-size: 96px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 
                0 0 20px rgba(255, 215, 0, 0.8),
                0 0 40px rgba(255, 215, 0, 0.5),
                4px 4px 8px rgba(0, 0, 0, 0.8);
            letter-spacing: 8px;
            transition: transform 0.1s;
        }

        #score.pop {
            animation: scorePop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .hint {
            margin-top: 40px;
            font-size: 16px;
            color: #7a5da0;
            letter-spacing: 2px;
            font-weight: normal;
            font-family: Arial, sans-serif;
        }

        .hint span {
            display: inline-block;
            background: rgba(138, 43, 226, 0.2);
            padding: 8px 15px;
            border-radius: 10px;
            margin: 0 5px;
            border: 2px solid rgba(138, 43, 226, 0.4);
        }

        /* Particle container */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700;
            animation: particleFly 1s ease-out forwards;
        }

        @keyframes particleFly {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* Floating increment text */
        .float-text {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            color: #32cd32;
            text-shadow: 
                0 0 20px rgba(50, 205, 50, 0.8),
                3px 3px 6px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 1;
                transform: translateY(-20px) scale(1.2);
            }
            100% {
                transform: translateY(-150px) scale(1);
                opacity: 0;
            }
        }

        /* Flash overlay */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0;
            z-index: 50;
            animation: flashScreen 0.5s ease-out;
        }

        @keyframes flashScreen {
            0% { opacity: 0; }
            30% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Max score celebration */
        @keyframes rainbowGlow {
            0%, 100% { 
                text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000;
                color: #ff6b6b;
            }
            16% { 
                text-shadow: 0 0 30px #ffa500, 0 0 60px #ffa500;
                color: #ffd700;
            }
            33% { 
                text-shadow: 0 0 30px #ffff00, 0 0 60px #ffff00;
                color: #ffff00;
            }
            50% { 
                text-shadow: 0 0 30px #00ff00, 0 0 60px #00ff00;
                color: #7fff00;
            }
            66% { 
                text-shadow: 0 0 30px #0000ff, 0 0 60px #0000ff;
                color: #6495ed;
            }
            83% { 
                text-shadow: 0 0 30px #ff00ff, 0 0 60px #ff00ff;
                color: #da70d6;
            }
        }

        #score.max-score {
            animation: rainbowGlow 2s linear infinite, scorePop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
    </style>
</head>
<body>
    <div id="scoreboard">
        <div id="scoreboard-frame">
            <div class="label">Score</div>
            <div id="score">$ 0</div>
            <div class="hint">
                <span>Press 1-3</span> to add points • <span>Press 0</span> to reset
            </div>
        </div>
    </div>

    <div id="particles"></div>

    <script>
        let score = 0;
        const MAX_SCORE = 100000;
        const scoreElement = document.getElementById('score');
        const scoreboardFrame = document.getElementById('scoreboard-frame');
        const particlesContainer = document.getElementById('particles');

        function formatScore(num) {
            return '$ ' + num.toLocaleString('en-US');
        }

        function updateScore() {
            scoreElement.textContent = formatScore(score);
        }

        function createParticles(count = 20) {
            const rect = scoreboardFrame.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const angle = (Math.PI * 2 * i) / count;
                const velocity = 100 + Math.random() * 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                particlesContainer.appendChild(particle);
                
                setTimeout(() => particle.remove(), 1000);
            }
        }

        function createFloatingText(value) {
            const floatText = document.createElement('div');
            floatText.className = 'float-text';
            floatText.textContent = '+' + value.toLocaleString('en-US');
            
            const rect = scoreElement.getBoundingClientRect();
            floatText.style.left = (rect.left + rect.width / 2 - 50) + 'px';
            floatText.style.top = rect.top + 'px';
            
            document.body.appendChild(floatText);
            
            setTimeout(() => floatText.remove(), 1500);
        }

        function createFlash() {
            const flash = document.createElement('div');
            flash.className = 'flash-overlay';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 500);
        }

        function addScore(value) {
            if (score >= MAX_SCORE) {
                return;
            }

            const newScore = Math.min(score + value, MAX_SCORE);
            const actualIncrease = newScore - score;
            score = newScore;

            // Update display
            updateScore();

            // Trigger animations
            scoreElement.classList.remove('pop', 'max-score');
            void scoreElement.offsetWidth; // Force reflow
            scoreElement.classList.add('pop');

            // Frame flash
            scoreboardFrame.classList.add('flash');
            setTimeout(() => scoreboardFrame.classList.remove('flash'), 300);

            // Particles
            createParticles(15 + value * 3);

            // Floating text
            createFloatingText(actualIncrease);

            // Screen flash
            createFlash();

            // Max score celebration
            if (score === MAX_SCORE) {
                setTimeout(() => {
                    scoreElement.classList.add('max-score');
                    createParticles(50);
                }, 400);
            }
        }

        function resetScore() {
            score = 0;
            updateScore();
            scoreElement.classList.remove('pop', 'max-score');
            
            // Small celebration for reset
            createParticles(10);
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            
            if (key === '1') {
                addScore(1000);
            } else if (key === '2') {
                addScore(2000);
            } else if (key === '3') {
                addScore(3000);
            } else if (key === '0') {
                resetScore();
            }
        });

        // Initialize
        updateScore();
    </script>
</body>
</html>
